# Builds, versions and publishes Lily.dmg. Releases are cut from `main` and marked by tags; there
# are no release branches, so nothing ever has to be merged "back" into main.
#
#   PR into `main` that changes ./VERSION  -> release candidate: test, build the DMG, attach it to the
#   (or this workflow)                        run (Artifacts); a VERSION bump fails if tag vX.Y.Z exists
#   That PR merged (push to `main`)        -> tag vX.Y.Z on the merge commit, publish the GitHub Release
#   Actions -> Build DMG -> Run workflow   -> on `main` only: `testing` publishes pre-release
#                                             vX.Y.Z-testing.N; `release` publishes vX.Y.Z if it's missing
#
# Signing and notarization run only for builds of reviewed `main` (push / manual run), never for
# PR code. Optional repository secrets (otherwise the app is ad-hoc signed):
#   MACOS_CERTIFICATE_P12        base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarytool credentials (app-specific password)
name: Build DMG

on:
  pull_request:
    branches: [main]
    paths: [VERSION, .github/workflows/dmg.yml] # a workflow change gets a candidate build too
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      channel:
        description: "testing: publish pre-release vX.Y.Z-testing.N. release: publish vX.Y.Z if it isn't released yet."
        type: choice
        options: [testing, release]
        default: testing

concurrency:
  group: dmg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Manual runs publish, so only from main (Run workflow lets you pick any branch).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.event_name == 'push' && 'release') || 'candidate' }}
      # Only whether signing applies, never the secrets themselves: each secret goes only to the step
      # that needs it, and PR runs (unreviewed code) never sign at all.
      HAS_SIGNING: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' && 'true' || '' }}
      HAS_NOTARY: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' && 'true' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dmg: ${{ steps.version.outputs.dmg }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build never pushes; only the publish job needs the token

      - name: Compute version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH, got '$version'"; exit 1
          fi
          sha="$(echo "$COMMIT_SHA" | cut -c1-7)"
          case "$CHANNEL" in
            release)   tag="v$version"; prerelease=false; dmg="Lily-$version.dmg" ;;
            candidate) tag="v$version"; prerelease=false; dmg="Lily-$version-rc.${{ github.run_number }}-$sha.dmg" ;;
            testing)   tag="v$version-testing.${{ github.run_number }}"; prerelease=true
                       dmg="Lily-$version-testing.${{ github.run_number }}-$sha.dmg" ;;
            *)         echo "::error::unknown channel $CHANNEL"; exit 1 ;;
          esac
          {
            echo "version=$version"; echo "tag=$tag"; echo "dmg=$dmg"; echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"; echo "BUILD_NUMBER=${{ github.run_number }}"; echo "DMG_NAME=$dmg"
          } >> "$GITHUB_ENV"

      - name: Require a new version
        id: released
        if: env.CHANNEL != 'testing'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            if [ "$CHANNEL" = candidate ]; then
              git fetch --quiet --depth 1 origin "$BASE_SHA"
              if [ "$(git show "$BASE_SHA:VERSION" | tr -d '[:space:]')" != "${{ steps.version.outputs.version }}" ]; then
                echo "::error file=VERSION::$tag is already released. Bump VERSION (e.g. $(awk -F. '{print $1"."$2"."$3+1}' VERSION)) in this PR."
                exit 1
              fi
              echo "::notice::This PR doesn't change VERSION ($tag is released): a test build only."
            fi
            echo "::notice::$tag is already released; building only, nothing to publish."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: make check

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: UNIVERSAL=1 make app

      - name: Build DMG
        run: |
          ./scripts/make-dmg.sh "build/$DMG_NAME"
          (cd build && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "build/$DMG_NAME" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/$DMG_NAME"
          (cd build && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DMG_NAME }}
          path: |
            build/${{ env.DMG_NAME }}
            build/${{ env.DMG_NAME }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.CHANNEL == 'release' && 90 || 14 }} # releases keep their DMG on the release page too

      - name: Upload symbols (not shipped in the DMG)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DMG_NAME }}.dSYM
          path: build/Lily.app.dSYM
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        run: |
          signed="ad-hoc (unsigned)"
          [ -n "$HAS_SIGNING" ] && signed="Developer ID"
          [ -n "$HAS_NOTARY" ] && signed="Developer ID, notarized"
          {
            echo "### 📦 $DMG_NAME"
            echo "- Channel: \`$CHANNEL\` · Version: \`$VERSION\` (build $BUILD_NUMBER)"
            echo "- Architectures: $(lipo -archs build/Lily.app/Contents/MacOS/Lily)"
            echo "- Signing: $signed"
            echo "- Size: $(du -h "build/$DMG_NAME" | cut -f1) · SHA-256: \`$(cut -d' ' -f1 "build/$DMG_NAME.sha256")\`"
            echo
            if [ "$CHANNEL" = candidate ]; then
              echo "Download it from **Artifacts** below. Merging this PR publishes it as **${{ steps.version.outputs.tag }}**."
            elif [ "${{ steps.released.outputs.released }}" = true ]; then
              echo "**${{ steps.version.outputs.tag }}** is already released: nothing to publish."
            else
              echo "Publishing as **${{ steps.version.outputs.tag }}**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    needs: build
    # Explicit result checks: a bare condition also requires every earlier job to have *succeeded*,
    # so one skipped job upstream used to skip publishing silently.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && needs.build.outputs.tag != '' && needs.build.outputs.released != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      DMG: ${{ needs.build.outputs.dmg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.dmg }}
          path: dist

      - name: Tag ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Lily $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub release
        run: |
          flags=(--verify-tag --generate-notes --title "Lily ${TAG#v}")
          if [ "${{ needs.build.outputs.prerelease }}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" "dist/$DMG" "dist/$DMG.sha256"
          echo "Published [$TAG]($(gh release view "$TAG" --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
